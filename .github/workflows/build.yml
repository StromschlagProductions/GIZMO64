name: Build GIZMO64
on:
  push:
    paths-ignore:
      - 'gizmo_lab/**'
      - '.gitignore'
    branches:
      - '**'
  pull_request:
    paths-ignore:
      - 'gizmo_lab/**'
      - '.gitignore'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Test C client and Python bridge
        run: make test
      - name: Build package
        run: make package
      - name: Upload complete package
        uses: actions/upload-artifact@v4
        with:
          name: GIZMO64-v0.2.1
          path: GIZMO64-v0.2.1.zip
          if-no-files-found: error
