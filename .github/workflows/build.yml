name: Build GIZMO64
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Test
        run: make test
      - name: Build
        run: make
      - name: Upload PRG
        uses: actions/upload-artifact@v4
        with:
          name: GIZMO64
          path: GIZMO64.PRG
          if-no-files-found: error
